# EXAMPLE ONLY: the shape of the Secret the Deployment expects. Never put a real key here.
#
# Create the real Secret straight from your shell, so the key never lands in a file:
#
#   kubectl create secret generic agentflow-secrets \
#     --from-literal=AGENTFLOW_API_KEY="$AGENTFLOW_API_KEY"
#
# On GKE also add --from-literal=AGENTFLOW_AUTH_TOKEN="$(cat ~/.agentflow-token)":
# with it set, every route except /healthz requires "Authorization: Bearer <token>".
#
# Apply the manifests with `kubectl apply -k k8s/overlays/<kind|gke>` (kustomization.yaml
# leaves this file out). `kubectl apply -f k8s/base/` would apply every *.yaml here,
# including this one, and overwrite the real key with the placeholder below.
#
# Secret values are only base64-encoded, not encrypted: anyone allowed to
# `kubectl get secret -o yaml` in the namespace can read the key.
apiVersion: v1
kind: Secret
metadata:
  name: agentflow-secrets
  labels:
    app.kubernetes.io/name: agentflow
type: Opaque
# stringData takes plain text; the API server stores it base64-encoded under data.
stringData:
  AGENTFLOW_API_KEY: "<your-api-key>"
