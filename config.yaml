flow:
  name: "competitive_analysis"

server:
  host: "0.0.0.0"
  port: 8000

# default LLM for every agent; an agent can still override model_name/model_backend in code.
# AGENTFLOW_MODEL_BACKEND / _NAME / _BASE_URL and AGENTFLOW_API_KEY override this block (see README)
llm:
  backend: "ollama"                       # "ollama" or "openai" (any OpenAI-compatible endpoint)
  model_name: "gemma4:26b-a4b-it-q4_K_M"
  # base_url: "http://localhost:11434"    # ollama: optional, defaults to http://localhost:11434
                                          # openai: required, there is no default endpoint
  # api_key_env: "MY_PROVIDER_KEY"        # openai only: env var holding the key, read if AGENTFLOW_API_KEY is unset
  #
  # e.g. Gemini through its OpenAI-compatible endpoint (key in AGENTFLOW_API_KEY):
  # backend: "openai"
  # model_name: "gemini-3.1-flash-lite"
  # base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"

base_skill_path: "skills"

storage:
  working_dir: ".agentflow"
